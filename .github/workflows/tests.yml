name: Tests

# Vérifie chaque Pull Request vers main : types, build, tests d'intégration.
#
# CONTRAT AVEC LA PROTECTION DE main : le contrôle obligatoire s'appelle « Types, build et tests »
# (nom du job). Ne PAS renommer ce job, ne PAS ajouter « paths » ou « paths-ignore » au déclencheur,
# ne PAS ajouter de condition « if » aux étapes de tests : le contrôle ne serait plus publié ou
# pourrait passer sans rien vérifier, et toutes les PR resteraient bloquées ou non contrôlées.
#
# TESTS OBLIGATOIRES : aucune étape de test ne peut être ignorée.
#   - Un fichier de test manquant fait échouer le job avec un message explicite.
#   - .github/scripts/verifier-tests.mjs exige au moins TESTS_MINIMUM tests réussis, aucun échec,
#     un bilan lisible et cohérent, et la confirmation du garde-fou réseau. Toute anomalie échoue.
#   - TESTS_MINIMUM est un plancher volontaire : le baisser doit être une décision relue en PR.
#
# SÉCURITÉ : ce workflow n'utilise AUCUN secret et AUCUN paiement réel.
#   - Déclencheur « pull_request » uniquement (jamais « pull_request_target » ni « workflow_run ») :
#     pour une PR venant d'un fork, GitHub n'injecte aucun secret et rend le jeton en lecture seule.
#   - Aucune référence à « secrets.* » et aucun « environment: » : ni GSC_SERVICE_ACCOUNT_JSON ni
#     les environnements Preview / Production ne sont accessibles.
#   - Jeton limité à « contents: read », identifiants non conservés après le checkout.
#   - Aucune expression dans les commandes : pas d'injection par titre, nom de branche ou message
#     de commit.
#   - Les clés utilisées par les tests sont des fausses clés imposées par tests/run.mjs ; le réseau
#     sortant est verrouillé pendant les tests (tests/fake-payments.mjs), Mollie et Resend sont simulés.
#   - Actions épinglées par empreinte de commit.
# Si ce fichier change, relire ces points avant de fusionner.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Types, build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TESTS_MINIMUM: '75'
    steps:
      - name: Récupérer le code de la PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Scripts d'installation désactivés : le code d'une PR peut modifier les dépendances.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Construire le site
        run: npm run build

      - name: Vérifier la présence des tests
        run: |
          manquants=0
          for f in tests/run.mjs tests/integration.mjs tests/garde-fous.mjs tests/fake-payments.mjs tests/mock-resend.mjs .github/scripts/verifier-tests.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error title=Fichier de test manquant::$f est introuvable : les tests d'intégration ne peuvent pas s'exécuter."
              manquants=1
            fi
          done
          if ! grep -q '"test:integration"' package.json; then
            echo "::error title=Commande de test manquante::package.json ne définit plus le script test:integration."
            manquants=1
          fi
          exit "$manquants"

      - name: Tests d'intégration (minimum exigé, aucun échec)
        run: |
          sortie="$RUNNER_TEMP/tests-integration.log"
          set +e
          npm run test:integration > "$sortie" 2>&1
          code=$?
          set -e
          cat "$sortie"
          node .github/scripts/verifier-tests.mjs "$sortie" "$code"
